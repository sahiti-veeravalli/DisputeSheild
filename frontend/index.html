<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DisputeShield AI — Intelligent Chargeback Defense</title>
    <meta
      name="description"
      content="AI-powered chargeback defense that investigates evidence, detects critical gaps, and provides explainable ML-assisted defense readiness assessment."
    />
    <meta property="og:title" content="DisputeShield AI — Intelligent Chargeback Defense" />
    <meta
      property="og:description"
      content="From dispute alert to evidence-ready defense — in seconds. Automated evidence investigation, ML readiness scoring, and human-in-the-loop dispute response packet compilation."
    />
    <meta property="og:type" content="website" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('disputeshield_theme');
          var isDark = saved === 'dark' || (!saved || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
