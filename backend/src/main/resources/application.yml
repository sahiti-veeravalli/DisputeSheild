spring:
  application:
    name: disputeshield-backend

  profiles:
    active: default

server:
  port: 8080

disputeshield:
  cors-origins: ${DISPUTESHIELD_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:8080,http://localhost}
  api-key: ${DISPUTESHIELD_API_KEY:disputeshield-demo-key-2026}
  jwt:
    secret: ${JWT_SECRET:disputeshield-production-grade-jwt-secret-key-2026-safe-default-signature}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
# ---------------------------------------------------------------------------
# default / local profile — H2 in-memory, zero setup, used for `mvn spring-boot:run`
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: default

  datasource:
    url: jdbc:h2:mem:disputeshield;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

---
# ---------------------------------------------------------------------------
# docker profile — Postgres, activated via SPRING_PROFILES_ACTIVE=docker
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/disputeshield}
    username: ${SPRING_DATASOURCE_USERNAME:disputeshield}
    password: ${SPRING_DATASOURCE_PASSWORD:disputeshield}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: false
